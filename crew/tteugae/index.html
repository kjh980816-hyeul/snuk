<style>
:root{
  --cream:#FFF8F2; --cream2:#FDEFE6; --vanilla:#FBEEDF; --beige:#F3E2D2; --beige-d:#E6CDBA;
  --pink:#FB84A4; --pink-d:#CC6C9A; --pink-l:#FEB8D0; --pink-x:#FFE3DF;
  --purple:#A88CC8; --purple-l:#C9B4E2;
  --ink:#484767; --ink-2:#6B6A8C; --ink-3:#9A98B4;
  --white:#FFFDFB;
  --r-lg:34px; --r-md:24px; --r-sm:16px;
  --sh-sm:0 4px 14px rgba(72,71,103,.07);
  --sh-md:0 10px 30px rgba(72,71,103,.10);
  --sh-lg:0 20px 50px rgba(72,71,103,.14);
  --font:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:24px}
body{
  font-family:var(--font); color:var(--ink); background:var(--cream);
  -webkit-font-smoothing:antialiased; line-height:1.65; overflow-x:hidden;
}
body::before{
  content:''; position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(1100px 600px at 12% -8%, #FFE8F0 0%, transparent 60%),
    radial-gradient(900px 520px at 92% 8%, #F0E7FA 0%, transparent 60%),
    radial-gradient(900px 700px at 50% 108%, #FDF0E2 0%, transparent 62%),
    var(--cream);
}
body::after{
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.5;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='24' viewBox='0 0 40 24'><g fill='none' stroke='%23E9D6C6' stroke-width='1.6' stroke-linecap='round' opacity='.55'><path d='M0 12c4-10 12-10 16 0-4 10 4 10 8 0 4-10 12-10 16 0'/><path d='M-4 24c4-10 12-10 16 0M20 24c4-10 12-10 16 0'/><path d='M4 0c4 10 12 10 16 0M28 0c4 10 12 10 16 0'/></g></svg>");
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink)}
::selection{background:var(--pink-l);color:var(--ink)}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:var(--cream2)}
::-webkit-scrollbar-thumb{background:var(--pink-l);border-radius:99px;border:3px solid var(--cream2)}
::-webkit-scrollbar-thumb:hover{background:var(--pink)}

.wrap{width:min(1180px,92vw);margin:0 auto}

/* ============ NAV ============ */
.nav{
  position:fixed; top:0; left:0; right:0; z-index:200;
  background:rgba(255,248,242,.72); backdrop-filter:blur(16px) saturate(1.3);
  border-bottom:1.5px solid transparent; transition:.35s;
}
.nav.solid{background:rgba(255,248,242,.93); border-bottom-color:var(--pink-x); box-shadow:0 6px 24px rgba(72,71,103,.06)}
.nav-in{display:flex;align-items:center;gap:18px;height:74px}
.nav-logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.nav-logo img{height:38px;width:auto;filter:drop-shadow(0 2px 4px rgba(72,71,103,.12))}
.nav-menu{display:flex;gap:4px;margin-left:auto;align-items:center}
.nav-menu a{
  padding:9px 15px;border-radius:99px;font-size:14.5px;font-weight:600;color:var(--ink-2);
  transition:.22s;position:relative;white-space:nowrap;
}
.nav-menu a:hover{color:var(--pink-d);background:var(--pink-x)}
.nav-menu a.on{color:#fff;background:var(--pink);box-shadow:0 4px 12px rgba(251,132,164,.4)}
.nav-toggle{display:none;font-size:24px;padding:6px 10px;border-radius:12px}
@media(max-width:900px){
  .nav-toggle{display:block;margin-left:auto}
  .nav-menu{
    position:absolute;top:74px;left:0;right:0;flex-direction:column;align-items:stretch;
    background:var(--white);padding:12px;gap:4px;border-bottom:1.5px solid var(--pink-x);
    box-shadow:var(--sh-md);display:none;
  }
  .nav-menu.open{display:flex}
  .nav-menu a{text-align:center;padding:13px}
}

/* ============ HERO ============ */
.hero{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:70px 0 90px;position:relative;
}
.hero-logo{width:min(620px,84vw);animation:float 5.5s ease-in-out infinite;filter:drop-shadow(0 14px 26px rgba(72,71,103,.16))}
@keyframes float{0%,100%{transform:translateY(0) rotate(-.4deg)}50%{transform:translateY(-14px) rotate(.4deg)}}
.hero-tag{
  margin-top:30px;font-size:clamp(17px,2.4vw,23px);font-weight:700;color:var(--ink);letter-spacing:-.02em;
}
.hero-tag b{color:var(--pink-d)}
.hero-sub{margin-top:14px;font-size:15.5px;color:var(--ink-2);max-width:560px;line-height:1.85}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:99px;
  font-weight:700;font-size:15px;transition:.25s;border:2px solid transparent;
}
.btn-p{background:var(--pink);color:#fff;box-shadow:0 8px 22px rgba(251,132,164,.42)}
.btn-p:hover{background:var(--pink-d);transform:translateY(-3px);box-shadow:0 12px 28px rgba(204,108,154,.45)}
.btn-o{background:var(--white);color:var(--ink);border-color:var(--beige-d);box-shadow:var(--sh-sm)}
.btn-o:hover{border-color:var(--pink);color:var(--pink-d);transform:translateY(-3px)}
.yarn{position:absolute;pointer-events:none;opacity:.5;animation:spin 22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.yarn.y1{width:78px;top:16%;left:6%}
.yarn.y2{width:56px;top:70%;left:9%;animation-duration:17s;animation-direction:reverse}
.yarn.y3{width:66px;top:22%;right:7%;animation-duration:26s;animation-direction:reverse}
.yarn.y4{width:46px;top:74%;right:11%;animation-duration:19s}
@media(max-width:760px){.yarn{display:none}}
.scroll-hint{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);color:var(--ink-3);font-size:12.5px;font-weight:600;letter-spacing:.08em;animation:bob 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}

/* ============ SECTION ============ */
.sec{padding:92px 0;position:relative}
.sec-head{text-align:center;margin-bottom:46px}
.sec-badge{
  display:inline-flex;align-items:center;gap:7px;padding:7px 17px;border-radius:99px;
  background:var(--pink-x);color:var(--pink-d);font-size:12.5px;font-weight:800;letter-spacing:.1em;
  border:1.5px dashed var(--pink-l);
}
.sec-title{margin-top:16px;font-size:clamp(28px,4.2vw,40px);font-weight:800;letter-spacing:-.03em}
.sec-title em{font-style:normal;color:var(--pink-d);position:relative}

/* ============ SLIDER ============ */
.sld{position:relative;padding:0 54px}
.sld-view{overflow:hidden;padding:14px 0}
.sld-track{display:flex;transition:transform .6s cubic-bezier(.22,1,.36,1);will-change:transform}
.sld-btn{
  position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;
  background:var(--white);box-shadow:var(--sh-md);border:1.5px solid var(--pink-x);
  display:grid;place-items:center;font-size:19px;font-weight:800;color:var(--ink-2);z-index:3;transition:.22s;
}
.sld-btn:hover{background:var(--pink);color:#fff;border-color:var(--pink);transform:translateY(-50%) scale(1.08)}
.sld-btn.prev{left:0}.sld-btn.next{right:0}
.sld-dots{display:flex;justify-content:center;gap:7px;margin-top:18px}
.sld-dots i{width:8px;height:8px;border-radius:99px;background:var(--pink-x);border:1.5px solid var(--pink-l);cursor:pointer;transition:.28s}
.sld-dots i.on{width:26px;background:var(--pink);border-color:var(--pink)}
.sld.solo .sld-btn,.sld.solo .sld-dots{display:none}
.sld.nodots .sld-dots{display:none}
@media(max-width:640px){
  .sld.mnav{padding:0}
  .sld.mnav .sld-btn{display:none}
  .sld{padding:0 26px}
  .sld-btn{width:28px;height:28px;font-size:15px}
  .sld-dots{margin-top:14px}
}

/* ============ MEMBERS ============ */
.mem{
  background:var(--white);border-radius:var(--r-lg);padding:26px 18px 22px;text-align:center;
  box-shadow:var(--sh-sm);border:1.5px solid var(--pink-x);transition:.3s;position:relative;overflow:hidden;
}
.mem::before{content:'';position:absolute;top:0;left:0;right:0;height:74px;background:linear-gradient(160deg,var(--c1,#FFE3EC),var(--c2,#F1E7FB));opacity:.85}
.mem:hover{transform:translateY(-8px);box-shadow:var(--sh-lg);border-color:var(--pink-l)}
.mem-av{
  position:relative;width:88px;height:88px;margin:0 auto 13px;border-radius:50%;
  background:var(--white);display:grid;place-items:center;font-size:40px;
  border:4px solid var(--white);box-shadow:0 6px 18px rgba(72,71,103,.13);overflow:hidden;
}
.mem-av img{width:100%;height:100%;object-fit:cover}
.mem-name{position:relative;font-size:18px;font-weight:800;letter-spacing:-.02em}
.mem-role{position:relative;display:inline-block;margin-top:6px;padding:3px 12px;border-radius:99px;background:var(--vanilla);color:var(--pink-d);font-size:11.5px;font-weight:700}
.mem-bio{position:relative;margin-top:11px;font-size:13px;color:var(--ink-2);line-height:1.68;min-height:44px}
.mem-links{position:relative;display:flex;justify-content:center;align-items:center;gap:5px;margin-top:14px;flex-wrap:nowrap;width:100%}
.slink{
  width:36px;height:36px;border-radius:13px;display:grid;place-items:center;transition:.24s;
  background:var(--cream2);border:1.5px solid var(--pink-x);position:relative;flex:0 0 auto;
}
.slink svg{width:18px;height:18px}
.mem-links .slink{
  width:min(36px, calc((100% - 20px)/5)); height:auto; aspect-ratio:1; border-radius:28%;
}
.mem-links .slink svg{width:54%;height:auto}
.slink:hover{transform:translateY(-4px) scale(1.08)}
.slink[data-t=chzzk]:hover{background:#00FFA3;border-color:#00E693}
.slink[data-t=soop]:hover{background:#0645AC;border-color:#0645AC}
.slink[data-t=soop]:hover svg{fill:#fff}
.slink[data-t=youtube]:hover{background:#FF0033;border-color:#FF0033}
.slink[data-t=youtube]:hover svg{fill:#fff}
.slink[data-t=x]:hover{background:#111;border-color:#111}
.slink[data-t=x]:hover svg{fill:#fff}
.slink[data-t=insta]:hover{background:linear-gradient(45deg,#F9CE34,#EE2A7B,#6228D7);border-color:#EE2A7B}
.slink[data-t=insta]:hover svg{fill:#fff}
.slink::after{
  content:attr(data-label);position:absolute;bottom:-29px;left:50%;transform:translateX(-50%) scale(.9);
  background:var(--ink);color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:8px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:.2s;z-index:4;
}
.slink:hover::after{opacity:1;transform:translateX(-50%) scale(1)}
@media(max-width:820px){

  .mem{padding:20px 10px 16px;border-radius:24px}

  .mem-role{font-size:10px;padding:2px 9px}
  .mem-links{gap:4px}
  .mem-links .slink{width:min(28px, calc((100% - 16px)/5));border-radius:26%}
  .slink::after{display:none}
}
@media(max-width:560px){
  .mem{padding:18px 10px 15px;border-radius:22px}

  .mem-role{font-size:10px;padding:2px 8px;margin-top:5px}
  .mem-bio{display:block;margin-top:8px;font-size:11.5px;line-height:1.6;min-height:0;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .mem-links{gap:3px;margin-top:10px}
  .mem-links .slink{width:min(26px, calc((100% - 12px)/5));border-radius:26%}

.mini:hover{background:var(--pink-x);color:var(--pink-d);border-color:var(--pink-l)}
.mini.del:hover{background:#FFE1E1;color:#D14B4B;border-color:#F5B5B5}
.hint{background:var(--vanilla);border:1.5px dashed var(--beige-d);border-radius:16px;padding:14px 16px;font-size:12.5px;color:var(--ink-2);line-height:1.75;margin-bottom:18px}
.hint b{color:var(--pink-d)}
.mem-pick{display:flex;flex-wrap:wrap;gap:7px;padding:12px;background:var(--white);border-radius:14px;border:1.5px solid var(--beige-d)}
.mem-pick label{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--cream2);font-size:12.5px;font-weight:700;cursor:pointer;transition:.2s;border:1.5px solid transparent;margin:0}
.mem-pick label:has(input:checked){background:var(--pink);color:#fff;border-color:var(--pink-d)}
.mem-pick input{width:auto;margin:0}
.toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(120px);z-index:900;
  background:var(--ink);color:#fff;padding:14px 26px;border-radius:99px;font-size:14px;font-weight:700;
  box-shadow:var(--sh-lg);transition:.35s cubic-bezier(.2,1.1,.4,1);opacity:0;
}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.reveal{opacity:0;transform:translateY(26px);transition:.7s cubic-bezier(.16,1,.3,1)}
.reveal.in{opacity:1;transform:none}
</style>

/* ── 슬라이더 ───────────────────────────────────────── */
var SLIDERS = [];
function Slider(rootSel, perViewFn, gap, autoMs, noDots){
  var root = $(rootSel);
  if(noDots) root.classList.add("nodots");
  var view = $('.sld-view', root), track = $('.sld-track', root), dots = $('.sld-dots', root);
  var page = 0, timer = null;
  function items(){ return $$('.sld-track > *', root) }
  function pv(){ return Math.max(1, perViewFn(window.innerWidth)) }
  function pages(){ return Math.max(1, Math.ceil(items().length / pv())) }
  var pageW = 0;
  function layout(){
    var n = pv(), list = items(), vw = view.clientWidth;
    var w = Math.floor((vw - gap*(n-1)) / n);
    pageW = w*n + gap*(n-1);
    track.style.gap = gap+'px';
    list.forEach(function(el){ el.style.flex = '0 0 '+w+'px'; el.style.width = w+'px' });
    root.classList.toggle('solo', list.length <= n);
    if(page > pages()-1) page = 0;
    move(true); renderDots();
  }
  function move(instant){
    if(instant) track.style.transition = 'none';
    track.style.transform = 'translateX(' + (-page * (pageW + gap)) + 'px)';
    if(instant) requestAnimationFrame(function(){ track.style.transition = '' });
  }
  function go(p){ page = ((p % pages()) + pages()) % pages(); move(); renderDots() }
  function renderDots(){
    var t = pages();
    dots.innerHTML = t<=1 ? '' : Array.apply(null,{length:t}).map(function(_,i){
      return '<i class="'+(i===page?'on':'')+'" data-p="'+i+'"></i>';
    }).join('');
    $$('i',dots).forEach(function(d){ d.onclick = function(){ go(+d.dataset.p); restart() } });
  }
  function restart(){ stop(); if(autoMs) timer = setInterval(function(){ go(page+1) }, autoMs) }
  function stop(){ if(timer){ clearInterval(timer); timer=null } }
  $('.sld-btn.prev', root).onclick = function(){ go(page-1); restart() };
  $('.sld-btn.next', root).onclick = function(){ go(page+1); restart() };
  root.addEventListener('mouseenter', stop);
  root.addEventListener('mouseleave', restart);
  root.addEventListener('touchstart', stop, {passive:true});
  var sx = null;
  root.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX }, {passive:true});
  root.addEventListener('touchend', function(e){
    if(sx==null) return;
    var dx = e.changedTouches[0].clientX - sx;
    if(Math.abs(dx) > 45) go(page + (dx<0?1:-1));
    sx = null; restart();
  });
  layout(); restart();
  var api = {layout:layout, go:go, reset:function(){ page=0; layout(); restart() }};
  SLIDERS.push(api);
  return api;
}
window.addEventListener('resize', function(){ SLIDERS.forEach(function(s){ s.layout() }) });

function evDates(e){
  var out=[], s=e.date, en=e.endDate||e.date;
  var d=new Date(s+'T00:00:00'), end=new Date(en+'T00:00:00');
  if(isNaN(d)||isNaN(end)) return [s];
  var guard=0;
  while(d<=end && guard++<400){ out.push(iso(d)); d.setDate(d.getDate()+1) }
  return out;
}
function eventsOn(day){ return DATA.events.filter(function(e){return evDates(e).indexOf(day)>=0})
  .sort(function(a,b){return (a.time||'').localeCompare(b.time||'')}) }
function renderCal(){
  var first = new Date(calY, calM, 1), start = first.getDay();
  var days = new Date(calY, calM+1, 0).getDate();
  var prevDays = new Date(calY, calM, 0).getDate();
  var todayIso = iso(new Date());
  $('#calMon').innerHTML = calY+'년 '+(calM+1)+'월<span>'+['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][calM]+'</span>';
  var html = ['일','월','화','수','목','금','토'].map(function(d,i){
    return '<div class="cal-dow '+(i===0?'sun':i===6?'sat':'')+'">'+d+'</div>';
  }).join('');
  for(var i=0;i<start;i++) html += '<div class="cal-cell mute">'+(prevDays-start+i+1)+'</div>';
  for(var d=1;d<=days;d++){
    var key = calY+'-'+('0'+(calM+1)).slice(-2)+'-'+('0'+d).slice(-2);
    var evs = eventsOn(key);
    var cls = 'cal-cell'+(evs.length?' has':'')+(key===todayIso?' today':'')+(key===selDay?' sel':'');
    var tags = evs.slice(0,2).map(function(e){
      return '<span class="cal-tag" style="background:'+typeColor(e.type)+'">'+esc(e.title)+'</span>';
    }).join('');
    html += '<div class="'+cls+'" data-day="'+key+'">'+d+tags+'</div>';
  }
  var total = start+days, tail = (7 - total%7)%7;
  for(var i=1;i<=tail;i++) html += '<div class="cal-cell mute">'+i+'</div>';
  $('#calGrid').innerHTML = html;
  $$('#calGrid .cal-cell.has').forEach(function(c){
    c.onclick = function(){
      selDay = (selDay===c.dataset.day ? null : c.dataset.day);
      renderCal(); renderCalDetail();
    };
  });
  $('#calLegend').innerHTML = Object.keys(TYPE_COLOR).map(function(t){
    return '<div><i style="background:'+TYPE_COLOR[t]+'"></i>'+t+'</div>';
  }).join('');
}
function renderCalDetail(){
  var box = $('#calDetail');
  if(!selDay){ box.innerHTML=''; return }
  var evs = eventsOn(selDay);
  if(!evs.length){ box.innerHTML=''; return }
  var dow = ['일','월','화','수','목','금','토'][new Date(selDay+'T00:00:00').getDay()];
  box.innerHTML = '<div class="cal-mask" id="cdMask"></div><div class="cal-detail"><div class="card">'
    + '<button class="cd-x" id="cdClose" aria-label="닫기">✕</button>'
    + '<div class="cd-date">'+esc(fmtDate(selDay))+' ('+dow+')<small>이 날의 일정 '+evs.length+'개</small></div>'
    + evs.map(function(e){
        var mems = (e.members||[]).map(function(n){
          var m = DATA.members.filter(function(x){return x.name===n})[0];
          return '<div class="cd-mem"><span style="font-size:17px">'+esc(m?(m.emoji||'🧶'):'🧶')+'</span>'
            + '<b>'+esc(n)+'</b>'+memLinks(m)+'</div>';
        }).join('');
        return '<div class="cd-ev">'
          + '<span class="chip" style="background:'+typeColor(e.type)+'">'+esc(e.type||'기타')+'</span>'
          + '<div class="cd-t">'+esc(e.title)+'</div>'
          + '<div class="cd-meta">'+(e.time?'<span>🕘 '+esc(e.time)+'</span>':'')
          + (e.endDate&&e.endDate!==e.date?'<span>📅 '+esc(fmtDate(e.date))+' ~ '+esc(fmtDate(e.endDate))+'</span>':'')+'</div>'
          + (e.desc?'<div class="cd-desc">'+esc(e.desc)+'</div>':'')
          + '<div class="cd-mems">'+(mems||'<span style="font-size:12.5px;color:var(--ink-3);font-weight:700">참가 멤버 미정</span>')+'</div>'
          + '</div>';
      }).join('')
    + '</div></div>';
  var close = function(){ selDay=null; renderCal(); renderCalDetail() };
  $('#cdClose').onclick = close;
  $('#cdMask').onclick = close;

/* ── 전체보기용 그리드 슬라이드 ─────────────────────── */
var gridRerender = null;
function gridPerPage(){ return window.innerWidth>=820 ? 15 : 6 }
function gridHtml(list, renderItem){
  var per = gridPerPage(), pages = [];
  for(var i=0;i<list.length;i+=per) pages.push(list.slice(i,i+per));
  if(!pages.length) pages = [[]];
  return '<div class="gsld" id="gsld"><button class="sld-btn prev" aria-label="이전">‹</button>'
    + '<div class="sld-view"><div class="sld-track" id="gTrack">'
    + pages.map(function(pg){ return '<div class="gpage">'+pg.map(renderItem).join('')+'</div>' }).join('')
    + '</div></div><button class="sld-btn next" aria-label="다음">›</button><div class="sld-dots" id="gDots"></div></div>';
}
function bindGrid(onItem){
  var root = $('#gsld'); if(!root) return;
  var view = $('.sld-view', root), track = $('#gTrack'), dots = $('#gDots');
  var total = $$('.gpage', root).length, page = 0;
  root.classList.toggle('solo', total <= 1);
  function move(instant){
    if(instant) track.style.transition='none';
    track.style.transform = 'translateX(' + (-page * view.clientWidth) + 'px)';
    if(instant) requestAnimationFrame(function(){ track.style.transition='' });
    dots.innerHTML = total<=1 ? '' : Array.apply(null,{length:total}).map(function(_,i){
      return '<i class="'+(i===page?'on':'')+'" data-p="'+i+'"></i>' }).join('');
    $$('i',dots).forEach(function(d){ d.onclick=function(){ page=+d.dataset.p; move() } });
  }
  $('.sld-btn.prev',root).onclick = function(){ page=(page-1+total)%total; move() };
  $('.sld-btn.next',root).onclick = function(){ page=(page+1)%total; move() };
  var sx=null;
  root.addEventListener('touchstart', function(e){ sx=e.touches[0].clientX }, {passive:true});
  root.addEventListener('touchend', function(e){
    if(sx==null) return;
    var dx = e.changedTouches[0].clientX - sx;
    if(Math.abs(dx)>45){ page=(page+(dx<0?1:-1)+total)%total; move() }
    sx=null;
  });
  if(onItem) onItem();
  move(true);
  root._move = move;
}
window.addEventListener('resize', function(){
  var root = $('#gsld'); if(!root) return;
  if(gridRerender && root._per !== gridPerPage()) return gridRerender();
  if(root._move) root._move(true);
});

var admTab = 'members';
/* 이미지 압축(2026-08-24): 폰 원본 사진(수 MB)을 base64로 그대로 보내면 서버 요청 한도(413)를
   넘어 저장이 통째로 실패하던 문제 — canvas 리사이즈 + JPEG 변환으로 수백 KB로 줄여서 전달. */
function fileToDataURL(input, cb, maxDim){
  var f = input.files && input.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    var src = r.result;
    var img = new Image();
    img.onload = function(){
      var max = maxDim || 1400;
      var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      var s = Math.min(1, max / Math.max(w, h, 1));
      var cw = Math.max(1, Math.round(w*s)), ch = Math.max(1, Math.round(h*s));
      var out = src;
      try{
        var c = document.createElement('canvas'); c.width = cw; c.height = ch;
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cw, ch); /* JPEG는 투명 미지원 → 흰 배경 */
        ctx.drawImage(img, 0, 0, cw, ch);
        var jpg = c.toDataURL('image/jpeg', .85);
        if(jpg.indexOf('data:image/jpeg') === 0 && (jpg.length < src.length || s < 1)) out = jpg;
      }catch(e){}
      if(out.length > 2500000){ toast('압축해도 이미지가 너무 커요 — 더 작은 사진으로 부탁해요 🙏'); return }
      cb(out);
    };
    img.onerror = function(){
      if(src.length > 2500000){ toast('이미지가 너무 커요 — 더 작은 사진으로 부탁해요 🙏'); return }
      cb(src);
    };
    img.src = src;
  };
  r.readAsDataURL(f);
}

function dl(blob,name){
  var a=document.createElement('a'), u=URL.createObjectURL(blob);
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(u); a.remove() },100);
}

/* ── 스크롤 효과 · 초기화 ───────────────────────────── */
var io = new IntersectionObserver(function(es){
  es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target) } });
},{threshold:.05, rootMargin:'0px 0px -30px 0px'});

/* ── 서버 연동(2026-08-20) ───────────────────────────────
   데이터는 서버(DB)가 원본: 로드 시 GET /api/crew/<slug>, HTML 내장 DATA는 폴백.
   관리자(스눅 ADMIN 로그인, localStorage 토큰 공유)는 수정 즉시 PUT으로 저장. */
var CREW_SLUG = (location.pathname.match(/\/crew\/([a-z0-9-]+)/)||[])[1] || 'tteugae';
function snukTok(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }
function snukJwtRole(t){ try{ return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role }catch(e){ return null } }
if(snukJwtRole(snukTok('snuk_access')||'')==='ADMIN' || snukJwtRole(snukTok('snuk_refresh')||'')==='ADMIN'){
  $('#admOpen').style.display='';
}
fetch('/api/crew/'+CREW_SLUG)
  .then(function(r){ if(!r.ok) throw 0; return r.json() })
  .then(function(j){
    var d = JSON.parse(j.data);
    if(!d || !d.club) return;
    DATA = d;
    var dd=new Date(), up=(d.events||[]).filter(function(e){return (e.endDate||e.date) >= iso(dd)}).sort(function(a,b){return a.date.localeCompare(b.date)})[0];
    if(up){ var bb=new Date(up.date+'T00:00:00'); calY=bb.getFullYear(); calM=bb.getMonth(); selDay=null; }
    reRender();
    SLIDERS.forEach(function(sl){ sl.layout() });
  })
  .catch(function(){});
var snukSvTimer = null, snukSaving = 0;
function scheduleServerSave(){ clearTimeout(snukSvTimer); snukSaving++; snukSvTimer = setTimeout(function(){ snukSvTimer=null; serverSave(true) }, 700) }
function serverSave(quiet){
  var t = snukTok('snuk_access');
  if(!t){ snukSaving=0; toast('서버 저장은 스눅(snuk.kr) 관리자 로그인 후 가능해요'); return }
  snukSaving = 1;
  var body = JSON.stringify({ data: JSON.stringify(DATA) });
  function put(a){ return fetch('/api/admin/crew/'+CREW_SLUG, {method:'PUT', headers:{'Content-Type':'application/json','Authorization':'Bearer '+a}, body:body}) }
  function verdict(r){ return r.ok ? 'ok' : (r.status===413 ? 'big' : 'auth') }
  put(t).then(function(r){
    if(r.status!==401 && r.status!==403) return verdict(r);
    if(!snukTok('snuk_refresh')) return 'auth';
    return fetch('/api/auth/refresh', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({refreshToken:snukTok('snuk_refresh')})})
      .then(function(rr){ if(!rr.ok) throw 0; return rr.json() })
      .then(function(jj){
        try{ localStorage.setItem('snuk_access',jj.accessToken); localStorage.setItem('snuk_refresh',jj.refreshToken) }catch(e){}
        return put(jj.accessToken).then(verdict);
      })
      .catch(function(){ return 'auth' });
  }).then(function(st){
    snukSaving = 0;
    if(st==='ok'){ toast(quiet ? '서버 반영 완료 🌐' : '서버에 저장했어요 — 모두에게 바로 반영돼요 🌐') }
    else if(st==='big'){ toast('서버 저장 실패 — 이미지 용량이 너무 커요. 해당 사진을 다시 올려 주세요 🙏') }
    else{ toast('서버 저장 실패 — 스눅 관리자 계정으로 다시 로그인해 주세요') }
  }).catch(function(){ snukSaving=0; toast('서버 저장 실패 — 네트워크를 확인해 주세요') });
}
/* 저장(디바운스 700ms + 전송) 중 새로고침하면 요청이 취소돼 데이터가 날아감 → 이탈 경고 */
window.addEventListener('beforeunload', function(e){
  if(snukSvTimer){ clearTimeout(snukSvTimer); snukSvTimer=null; serverSave(true) } /* 대기 중이면 즉시 전송 시도 */
  if(snukSaving){ e.preventDefault(); e.returnValue='서버 저장이 아직 진행 중이에요. 잠시 후에 닫아 주세요.'; return e.returnValue }
});
